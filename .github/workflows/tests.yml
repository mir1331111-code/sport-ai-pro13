name: tests

on:
  # Main CI owns the full two-version validation for main pushes and PRs.
  # Keep this workflow on feature branches to avoid running the same suite twice.
  push:
    branches-ignore: [main]
  pull_request:
    branches-ignore: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    name: unittest (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - name: Smoke-test Streamlit app script
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("App.py").run(timeout=45)
          if app.exception:
              for error in app.exception:
                  print(error.message)
              raise SystemExit("App.py raised an exception in Streamlit AppTest")
          print("App.py rendered without Streamlit exceptions")
          PY
