name: Forecast ledger tests
on:
  push:
    branches: ["feat/forecast-audit-ledger"]
  pull_request:
    branches: [main]
jobs:
  forecast-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Compile changed module and tests
        run: python -m compileall -q model/forecast_ledger.py tests/test_forecast_ledger.py
      - name: Run forecast ledger tests
        run: python -m unittest discover -s tests -p 'test_forecast_ledger.py' -v
