name: Forecast error learning tests
on:
  push:
    branches: ["feat/online-error-learning", "feat/dixon-coles-ab-audit", "fix/restore-all-leagues-and-best-picks"]
  pull_request:
    branches: [main, "feat/forecast-audit-ledger"]
jobs:
  error-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model test dependency
        run: python -m pip install "numpy>=1.24,<3"
      - name: Compile learning module and tests
        run: python -m compileall -q model/forecast_ledger.py model/error_learner.py model/learning_service.py model/engine.py model/temporal.py model/walk_forward.py data/fixture_merge.py data/sources.py ui/tabs/scanner.py tests/test_forecast_ledger.py tests/test_error_learner.py tests/test_learning_service.py tests/test_dixon_coles_reference.py tests/test_temporal_model.py tests/test_walk_forward.py tests/test_fixture_merge.py
      - name: Run Dixon-Coles reference and H2H audit regression tests
        run: python -m unittest discover -s tests -p "test_dixon_coles_reference.py" -v
      - name: Run temporal model and league rho tests
        run: python -m unittest discover -s tests -p "test_temporal_model.py" -v
      - name: Run chronological walk-forward comparison tests
        run: python -m unittest discover -s tests -p "test_walk_forward.py" -v
      - name: Run multi-source fixture merge tests
        run: python -m unittest discover -s tests -p "test_fixture_merge.py" -v
      - name: Run forecast ledger tests
        run: python -m unittest discover -s tests -p "test_forecast_ledger.py" -v
      - name: Run forecast ledger and learning tests
        run: python -m unittest discover -s tests -p "test_error_learner.py" -v
      - name: Run service integration tests
        run: python -m unittest discover -s tests -p "test_learning_service.py" -v
