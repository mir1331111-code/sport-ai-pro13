name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m compileall -q App.py config.py context_football.py security.py betting data llm model storage ui tests
      - name: Run full unit test suite
        run: python -m unittest discover -s tests -v
      - name: Smoke-test Streamlit app script
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("App.py").run(timeout=45)
          if app.exception:
              for error in app.exception:
                  print(error.message)
              raise SystemExit("App.py raised an exception in Streamlit AppTest")
          print("App.py rendered without Streamlit exceptions")
          PY
